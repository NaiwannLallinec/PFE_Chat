<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Mes chaînes</title></head>
<body>
  <h1>Configurer vos chaînes</h1>
  <form id="channelsForm">
    <label>Twitch : <input name="twitchChannel" required></label><br>
    <label>YouTube LiveChatID : <input name="youtubeLiveChatId" required></label><br>
    <label>YouTube VideoID : <input name="youtubeVideoId" required></label><br>
    <label>TikTok : <input name="tiktokUsername" required></label><br>
    <button type="submit">Sauver</button>
  </form>
  <button id="logoutBtn">Se déconnecter</button>
  <script>
    document.getElementById('channelsForm').addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/save-channels', {
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)
      });
      alert((await res.json()).message);
    });
    document.getElementById('logoutBtn').onclick = async () => {
      await fetch('/logout',{method:'POST'}); location.href='/login';
    };
  </script>
</body></html>
