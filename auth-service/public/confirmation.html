<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation OAuth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f0f4ff 0%, #d9e7ff 100%);
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    p {
      margin-bottom: 20px;
      font-size: 1.2rem;
      color: #333;
    }
    a {
      display: block;
      margin: 10px 0;
      padding: 10px 20px;
      background: #4ecdc4;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1.2rem;
    }
    a:hover {
      background: #ff6b6b;
    }
  </style>
</head>
<body>
  <h1>Confirmation OAuth</h1>
  <p id="message">Token récupéré avec succès !</p>
  <a href="/">Retour à l'authentification</a>
  <a href="/chat">Accéder au chat agrégé</a>
  <script>
    // Afficher un message spécifique en fonction du paramètre platform
    const urlParams = new URLSearchParams(window.location.search);
    const platform = urlParams.get('platform');
    if (platform) {
      document.getElementById('message').textContent = `Token ${platform} récupéré avec succès !`;
    }
  </script>
</body>
</html>
