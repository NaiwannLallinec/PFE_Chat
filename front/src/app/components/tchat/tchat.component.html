<div class="chat-wrapper">

  <div class="chat-header">
    <h2 class="chat-title">Tchat Agrégé</h2>

    <div class="platform-toggles">
      <button class="platform-button twitch" [class.active]="platformFilters.TWITCH" (click)="togglePlatform('TWITCH')">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#9146ff">
          <path d="M3.857 0L.857 4.5v16.5h6v3h3l3-3h4.714L23.143 15V0H3.857zM20.143 13.5l-2.143 2.25H12l-3 3v-3H6V3h14.143v10.5z"/>
          <path d="M17.143 5.25h-2.143v6h2.143v-6zm-5 0h-2.143v6h2.143v-6z"/>
        </svg>
      </button>
      <button class="platform-button tiktok" [class.active]="platformFilters.TIKTOK" (click)="togglePlatform('TIKTOK')">
        <svg viewBox="0 0 256 256" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <g fill="none">
            <path
              d="M204.8 84.5c-21.7-7.1-39.2-24.5-45.5-46.3H128v122.4c0 13.1-10.6 23.7-23.7 23.7s-23.7-10.6-23.7-23.7c0-13.1 10.6-23.7 23.7-23.7 2.3 0 4.6.4 6.8 1.1V96.5c-2.2-.3-4.5-.5-6.8-.5-32.5 0-58.8 26.3-58.8 58.8 0 32.5 26.3 58.8 58.8 58.8 32.5 0 58.8-26.3 58.8-58.8V112c14.7 10.7 32.6 17.1 52 17.1V89.6c-11.1 0-21.6-1.9-31.2-5.1z"
              fill="#25F4EE"
            />
            <path
              d="M204.8 84.5v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-32.5 0-58.8-26.3-58.8-58.8 0-32.5 26.3-58.8 58.8-58.8 2.3 0 4.6.2 6.8.5v24.6c-2.2-.7-4.5-1.1-6.8-1.1-13.1 0-23.7 10.6-23.7 23.7 0 13.1 10.6 23.7 23.7 23.7 13.1 0 23.7-10.6 23.7-23.7V38.2h31.3c6.3 21.8 23.8 39.2 45.5 46.3z"
              fill="#FE2C55"
            />
            <path
              d="M152 38.2c6.3 21.8 23.8 39.2 45.5 46.3v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-19.4 0-36.7-9.5-47.5-24.1 10.4 16.5 28.7 27.4 49.5 27.4 32.5 0 58.8-26.3 58.8-58.8V91.8c14.7 10.7 32.6 17.1 52 17.1V84.5c-21.7-7.1-39.2-24.5-45.5-46.3H152z"
              fill="#FFFFFF"
            />
          </g>
        </svg>

      </button>
      <button class="platform-button youtube" [class.active]="platformFilters.YOUTUBE" (click)="togglePlatform('YOUTUBE')">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#ff0000">
          <path d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-1-2.1-1.1C17.4 2.5 12 2.5 12 2.5s-5.4 0-8.6.3c-.4 0-1.3.1-2.1 1.1C.7 4.6.5 6.2.5 6.2S.2 8.1.2 9.9v1.3c0 1.8.3 3.7.3 3.7s.2 1.6.8 2.3c.8.9 1.9.9 2.4 1C8.6 18.9 12 19 12 19s5.4 0 8.6-.3c.4 0 1.3-.1 2.1-1.1.6-.7.8-2.3.8-2.3s.3-1.8.3-3.7v-1.3c0-1.8-.3-3.7-.3-3.7zM9.7 14.2V7.8l6.2 3.2-6.2 3.2z"/>
        </svg>
      </button>
    </div>
  </div>

  

  <div #scrollContainer class="chat-container">
    <div *ngFor="let msg of messages" class="chat-message" [ngClass]="'platform-' + msg.platform.toLowerCase()">
      <div class="message-header">
        <div class="platform-indicator">
          <ng-container [ngSwitch]="msg.platform">
            <svg *ngSwitchCase="'TWITCH'" viewBox="0 0 24 24" width="16" height="16" fill="#9146ff">
              <path d="M3.857 0L.857 4.5v16.5h6v3h3l3-3h4.714L23.143 15V0H3.857zM20.143 13.5l-2.143 2.25H12l-3 3v-3H6V3h14.143v10.5z"/>
              <path d="M17.143 5.25h-2.143v6h2.143v-6zm-5 0h-2.143v6h2.143v-6z"/>
            </svg>
            <svg *ngSwitchCase="'TIKTOK'" viewBox="0 0 256 256" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
              <g fill="none">
                <path
                  d="M204.8 84.5c-21.7-7.1-39.2-24.5-45.5-46.3H128v122.4c0 13.1-10.6 23.7-23.7 23.7s-23.7-10.6-23.7-23.7c0-13.1 10.6-23.7 23.7-23.7 2.3 0 4.6.4 6.8 1.1V96.5c-2.2-.3-4.5-.5-6.8-.5-32.5 0-58.8 26.3-58.8 58.8 0 32.5 26.3 58.8 58.8 58.8 32.5 0 58.8-26.3 58.8-58.8V112c14.7 10.7 32.6 17.1 52 17.1V89.6c-11.1 0-21.6-1.9-31.2-5.1z"
                  fill="#25F4EE"
                />
                <path
                  d="M204.8 84.5v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-32.5 0-58.8-26.3-58.8-58.8 0-32.5 26.3-58.8 58.8-58.8 2.3 0 4.6.2 6.8.5v24.6c-2.2-.7-4.5-1.1-6.8-1.1-13.1 0-23.7 10.6-23.7 23.7 0 13.1 10.6 23.7 23.7 23.7 13.1 0 23.7-10.6 23.7-23.7V38.2h31.3c6.3 21.8 23.8 39.2 45.5 46.3z"
                  fill="#FE2C55"
                />
                <path
                  d="M152 38.2c6.3 21.8 23.8 39.2 45.5 46.3v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-19.4 0-36.7-9.5-47.5-24.1 10.4 16.5 28.7 27.4 49.5 27.4 32.5 0 58.8-26.3 58.8-58.8V91.8c14.7 10.7 32.6 17.1 52 17.1V84.5c-21.7-7.1-39.2-24.5-45.5-46.3H152z"
                  fill="#FFFFFF"
                />
              </g>
            </svg>

            <svg *ngSwitchCase="'YOUTUBE'" viewBox="0 0 24 24" width="16" height="16" fill="#ff0000">
              <path d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-1-2.1-1.1C17.4 2.5 12 2.5 12 2.5s-5.4 0-8.6.3c-.4 0-1.3.1-2.1 1.1C.7 4.6.5 6.2.5 6.2S.2 8.1.2 9.9v1.3c0 1.8.3 3.7.3 3.7s.2 1.6.8 2.3c.8.9 1.9.9 2.4 1C8.6 18.9 12 19 12 19s5.4 0 8.6-.3c.4 0 1.3-.1 2.1-1.1.6-.7.8-2.3.8-2.3s.3-1.8.3-3.7v-1.3c0-1.8-.3-3.7-.3-3.7zM9.7 14.2V7.8l6.2 3.2-6.2 3.2z"/>
            </svg>
          </ng-container>
        </div>
        <span class="username">{{ msg.text.split(':')[0] }}</span>
        <span class="timestamp">{{ now | date:'shortTime' }}</span>
      </div>
      <div class="message-content">{{ msg.text.split(':').slice(1).join(':') }}</div>
    </div>
  </div>

  <div class="chat-footer">
    <div class="platform-stats">
  <div class="stat twitch">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="#9146ff">
      <path d="M3.857 0L.857 4.5v16.5h6v3h3l3-3h4.714L23.143 15V0H3.857zM20.143 13.5l-2.143 2.25H12l-3 3v-3H6V3h14.143v10.5z"/>
      <path d="M17.143 5.25h-2.143v6h2.143v-6zm-5 0h-2.143v6h2.143v-6z"/>
    </svg>
    <span class="count">{{ viewerCounts.twitch }}</span>
  </div>

  <div class="stat tiktok">
    <svg viewBox="0 0 256 256" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
      <g fill="none">
        <path d="M204.8 84.5c-21.7-7.1-39.2-24.5-45.5-46.3H128v122.4c0 13.1-10.6 23.7-23.7 23.7s-23.7-10.6-23.7-23.7c0-13.1 10.6-23.7 23.7-23.7 2.3 0 4.6.4 6.8 1.1V96.5c-2.2-.3-4.5-.5-6.8-.5-32.5 0-58.8 26.3-58.8 58.8 0 32.5 26.3 58.8 58.8 58.8 32.5 0 58.8-26.3 58.8-58.8V112c14.7 10.7 32.6 17.1 52 17.1V89.6c-11.1 0-21.6-1.9-31.2-5.1z" fill="#25F4EE"/>
        <path d="M204.8 84.5v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-32.5 0-58.8-26.3-58.8-58.8 0-32.5 26.3-58.8 58.8-58.8 2.3 0 4.6.2 6.8.5v24.6c-2.2-.7-4.5-1.1-6.8-1.1-13.1 0-23.7 10.6-23.7 23.7 0 13.1 10.6 23.7 23.7 23.7 13.1 0 23.7-10.6 23.7-23.7V38.2h31.3c6.3 21.8 23.8 39.2 45.5 46.3z" fill="#FE2C55"/>
        <path d="M152 38.2c6.3 21.8 23.8 39.2 45.5 46.3v24.4c-19.4 0-37.3-6.4-52-17.1v43.9c0 32.5-26.3 58.8-58.8 58.8-19.4 0-36.7-9.5-47.5-24.1 10.4 16.5 28.7 27.4 49.5 27.4 32.5 0 58.8-26.3 58.8-58.8V91.8c14.7 10.7 32.6 17.1 52 17.1V84.5c-21.7-7.1-39.2-24.5-45.5-46.3H152z" fill="#FFFFFF"/>
      </g>
    </svg>
    <span class="count">{{ viewerCounts.tiktok }}</span>
  </div>

  <div class="stat youtube">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="#ff0000">
      <path d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-1-2.1-1.1C17.4 2.5 12 2.5 12 2.5s-5.4 0-8.6.3c-.4 0-1.3.1-2.1 1.1C.7 4.6.5 6.2.5 6.2S.2 8.1.2 9.9v1.3c0 1.8.3 3.7.3 3.7s.2 1.6.8 2.3c.8.9 1.9.9 2.4 1C8.6 18.9 12 19 12 19s5.4 0 8.6-.3c.4 0 1.3-.1 2.1-1.1.6-.7.8-2.3.8-2.3s.3-1.8.3-3.7v-1.3c0-1.8-.3-3.7-.3-3.7zM9.7 14.2V7.8l6.2 3.2-6.2 3.2z"/>
    </svg>
    <span class="count">{{ viewerCounts.youtube }}</span>
  </div>

  <div class="stat">
    <i class="fas fa-users"></i>
    <span class="count">{{ viewerCounts.total }}</span>
  </div>
</div>

  </div>

</div>
