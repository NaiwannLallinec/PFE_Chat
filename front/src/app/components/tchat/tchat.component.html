<div class="chat-wrapper">

  <div class="chat-header">
    <h2 class="chat-title">Tchat Agrégé</h2>

    <div class="platform-toggles">
      <button class="platform-button twitch" [class.active]="platformFilters.TWITCH" (click)="togglePlatform('TWITCH')">
        <i class="fab fa-twitch"></i>
      </button>
      <button class="platform-button tiktok" [class.active]="platformFilters.TIKTOK" (click)="togglePlatform('TIKTOK')">
        <i class="fab fa-tiktok"></i>
      </button>
      <button class="platform-button youtube" [class.active]="platformFilters.YOUTUBE" (click)="togglePlatform('YOUTUBE')">
        <i class="fab fa-youtube"></i>
      </button>
    </div>
  </div>

  <div class="chat-controls">
    <input [(ngModel)]="streamName" placeholder="Nom Twitch" />
    <button (click)="startTwitch()">▶ Twitch</button>

    <input [(ngModel)]="tiktokName" placeholder="Username TikTok" />
    <button (click)="startTikTok()">▶ TikTok</button>

    <input [(ngModel)]="ytChatId" placeholder="Live Chat ID YouTube" />
    <input [(ngModel)]="ytVideoId" placeholder="Video ID YouTube" />
    <button (click)="startYouTube()">▶ YouTube</button>
  </div>

  <div class="chat-container">
    <div *ngFor="let msg of messages" class="chat-message" [ngClass]="'platform-' + msg.platform.toLowerCase()">
      <div class="message-header">
        <div class="platform-indicator">
          <i [ngClass]="{
            'fab fa-twitch': msg.platform === 'TWITCH',
            'fab fa-youtube': msg.platform === 'YOUTUBE',
            'fab fa-tiktok': msg.platform === 'TIKTOK'
          }"></i>
        </div>
        <span class="username">{{ msg.text.split(':')[0] }}</span>
        <span class="timestamp">{{ now | date:'shortTime' }}</span>
      </div>
      <div class="message-content">{{ msg.text.split(':').slice(1).join(':') }}</div>
    </div>
  </div>

  <div class="chat-footer">
    <div class="platform-stats">
      <div class="stat twitch">
        <i class="fab fa-twitch"></i>
        <span class="count">{{ viewerCounts.twitch }}</span>
      </div>
      <div class="stat tiktok">
        <i class="fab fa-tiktok"></i>
        <span class="count">{{ viewerCounts.tiktok }}</span>
      </div>
      <div class="stat youtube">
        <i class="fab fa-youtube"></i>
        <span class="count">{{ viewerCounts.youtube }}</span>
      </div>
      <div class="stat">
        <i class="fas fa-users"></i>
        <span class="count">{{ viewerCounts.total }}</span>
      </div>
    </div>
  </div>

</div>
